name: Auto-Sync JKT48 Database

on:
  schedule:
    # Berjalan otomatis tiap hari jam 03.00 WIB (20.00 UTC)
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run sync script
        run: |
          node scripts/sync_member_json.js

      - name: Commit and push changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add jkt48/member.json jkt48/all_members.json jkt48/static/members/
            git commit -m "chore(jkt48): auto-sync active members and status [skip ci]"
            git push origin master
            git push origin master:main --force || true
            echo "Data berhasil disinkronisasi."
          else
            echo "Database sudah versi terbaru, tidak ada perubahan."
          fi
